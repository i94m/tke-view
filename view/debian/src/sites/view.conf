#
# Main TKE Intranet Virtual Host (local environment)
# --------------------------------------
#
<VirtualHost 0.0.0.0:80>
    ServerName localhost
    DocumentRoot /opt/tk/core/web
    <Directory />
        DirectoryIndex index.html index.php
        AllowOverride All
        Require all granted
    </Directory>
    Alias /vivid /opt/tk/core/vivid/public
    <Directory /vivid>
        DirectoryIndex index.html index.php
        AllowOverride All
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteOptions Inherit
    ExpiresActive On
    ExpiresDefault now
    <LocationMatch "^/v[0-9]+/">
        ExpiresDefault "now plus 7 days"
    </LocationMatch>
    <Location /img/>
        ExpiresDefault "now plus 7 days"
    </Location>
    RewriteRule ^/v[0-9]+/(.*) /$1
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    <Directory "/opt/tk/core/web/marketquery">
      AllowOverride All
    </Directory>
    <Directory "/opt/tk/core/web/nimod">
      AllowOverride All
    </Directory>
    <Directory "/opt/tk/core/web/crm">
      AllowOverride All
    </Directory>
    <Directory "/opt/tk/core/web/oli_2">
          AllowOverride All
    </Directory>
    <Directory "/opt/tk/core/web/webportal">
      AllowOverride All
    </Directory>
    <Directory "/opt/tk/core/web/webportal2">
      AllowOverride All
    </Directory>
    <Directory "/opt/tk/core/web/standard_template">
      AllowOverride All
    </Directory>
    <Directory "/opt/tk/core/web/sharp">
      AllowOverride All
    </Directory>
	  <Directory "/opt/tk/core/web/NIWebportal">
      AllowOverride All
    </Directory>
</VirtualHost>
